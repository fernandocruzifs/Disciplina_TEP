{% extends "base2.html" %}
{% block content %}
    <div class="post-entry">
        <h2>{{post.titulo}}</h2>
        <p>{{ post.texto }}</p>
         <p>{{ post.autor }}</p>
    </div>
    <a class="btn btn-sm btn-primary" href="{% url 'edicao_post' post.pk %}">Editar</a>
          <button class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#modalExcluir"
                data-url="{% url 'exclusao_post' post.pk %}" data-nome="{{ post.titulo }}">Excluir</button>
    <!-- Modal de confirmação -->
<div class="modal fade" id="modalExcluir" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="formExcluir" method="post">
                {% csrf_token %}
                <div class="modal-header">
                    <h5>Excluir</h5>
                    
                    <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                </div>
                <div class="modal-body">
                    Tem certeza que deseja excluir <span id="nomeProduto"></span>?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-danger">Excluir</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    var modalExcluir = document.getElementById('modalExcluir');
    modalExcluir.addEventListener('show.bs.modal', function (event) {
        var button = event.relatedTarget;
        var url = button.getAttribute('data-url');
        var nome = button.getAttribute('data-nome');
        var form = document.getElementById('formExcluir');
        var nomeProduto = document.getElementById('nomeProduto');

        form.action = url;
        nomeProduto.textContent = nome;
    });
</script>
 {% endblock content %}
